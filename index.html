<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>

<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;600&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: one-screen arcade cabinet — thin HUD strip on top, canvas fills the rest, overlays float centered. Single dark look by choice. */
:root{
  --void:#0a0c11; --panel:#12161f; --line:#262d3c; --chalk:#ece6d6; --mute:#8a90a0;
  --red:#ff2d3d; --gold:#ffc94a; --runner:#5cf2d6; --good:#59e08a; --bad:#ff6b6b;
  --f-display:"Black Han Sans","IBM Plex Sans KR",system-ui,sans-serif;
  --f-body:"IBM Plex Sans KR",system-ui,-apple-system,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--void);color:var(--chalk);font-family:var(--f-body);overflow:hidden;user-select:none;-webkit-user-select:none}
#app{height:100%;display:flex;flex-direction:column}
.hud{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:var(--panel);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand b{font-family:var(--f-display);font-weight:400;font-size:20px;color:var(--red);letter-spacing:.02em}
.brand span{font-size:12px;color:var(--mute);letter-spacing:.08em;white-space:nowrap}
.timer{font-family:var(--f-mono);font-weight:700;font-size:26px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.right{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.chip{font-size:11px;padding:4px 8px;border:1px solid var(--line);border-radius:3px;color:var(--mute);white-space:nowrap}
.chip.on{border-color:var(--gold);color:var(--gold)}
.chip.deaths{border-color:transparent;font-family:var(--f-mono);color:var(--chalk)}
#stage{position:relative;flex:1;min-height:0}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:rgba(10,12,17,.55);overflow:auto}
.card{width:100%;max-width:460px;background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--red);padding:24px;display:flex;flex-direction:column;gap:14px}
.card h1,.card h2{font-family:var(--f-display);font-weight:400;margin:0;text-wrap:balance;line-height:1.1}
.card h1{font-size:40px;color:var(--red)}
.card h2{font-size:28px}
.card p{margin:0;line-height:1.6;color:var(--chalk)}
.eyebrow{font-size:11px;letter-spacing:.14em;color:var(--mute);text-transform:uppercase}
.gold{color:var(--gold)}
.keys{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px;color:var(--mute)}
.keys kbd{font-family:var(--f-mono);font-size:12px;color:var(--chalk);background:var(--void);border:1px solid var(--line);border-radius:3px;padding:2px 6px;white-space:nowrap}
.row{display:flex;gap:8px;flex-wrap:wrap}
button{font-family:var(--f-body);font-weight:600;font-size:15px;cursor:pointer;border-radius:3px;padding:11px 18px;border:1px solid var(--line);background:var(--void);color:var(--chalk)}
button.go{background:var(--red);border-color:var(--red);color:#fff}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.big{font-family:var(--f-mono);font-size:34px;font-weight:700;font-variant-numeric:tabular-nums}
table{width:100%;border-collapse:collapse;font-family:var(--f-mono);font-size:13px;font-variant-numeric:tabular-nums}
td{padding:6px 0;border-bottom:1px solid var(--line)}
td:not(:first-child){text-align:right}
.up{color:var(--bad)} .down{color:var(--good)}
.gradeRow{display:flex;gap:16px;align-items:center}
.grade{flex:none;width:92px;height:92px;display:grid;place-items:center;border:3px solid currentColor;font-family:var(--f-display);font-size:64px;line-height:1}
.gradeInfo{display:flex;flex-direction:column;gap:4px;min-width:0}.gradeInfo p{font-size:13px}.gradeInfo .mute{color:var(--mute)}
.ability{border:1px solid var(--gold);padding:14px;display:flex;flex-direction:column;gap:6px}
.ability b{font-family:var(--f-display);font-weight:400;font-size:24px;color:var(--gold)}
.diffs{display:flex;flex-direction:column;gap:6px}
.diff{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:4px 12px;text-align:left;padding:10px 12px;font-weight:400;font-size:13px}
.diff .dn{font-family:var(--f-display);font-size:18px;display:flex;align-items:center;gap:8px}
.diff .dn kbd{font-family:var(--f-mono);font-size:11px;color:var(--mute);border:1px solid var(--line);border-radius:3px;padding:1px 5px}
.diff .dd{color:var(--mute);min-width:0}
.diff .dt{font-family:var(--f-mono);font-size:11px;color:var(--mute);white-space:nowrap}
.diff.sel{border-color:var(--gold);background:#1d1a12}
.diff.sel .dn{color:var(--gold)}
.diff.hell .dn{color:var(--red)}
.diff.hell.sel{border-color:var(--red);background:#22090d}
@media (max-width:420px){.diff{grid-template-columns:1fr auto}.diff .dd{grid-column:1 / -1;order:3}}
.chip.hellc{border-color:var(--red);color:var(--red)}
#touch{position:absolute;inset:auto 0 0 0;display:flex;justify-content:space-between;align-items:flex-end;pointer-events:none;
  padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px))}
#touch .grp{display:flex;gap:10px;align-items:flex-end}
#touch button{pointer-events:auto;width:64px;height:64px;padding:0;border-radius:50%;background:rgba(18,22,31,.75);font-size:13px;touch-action:none}
#touch button.jump{width:78px;height:78px;border-color:var(--runner);color:var(--runner)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div id="app">
  <header class="hud">
    <div class="brand"><b>RED LINE</b><span id="chLabel">코스 #0001</span></div>
    <div class="timer" id="timer">0:00.000</div>
    <div class="right" id="chips"></div>
  </header>
  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="touch" hidden>
      <div class="grp"><button id="tL" aria-label="왼쪽">◀</button><button id="tR" aria-label="오른쪽">▶</button></div>
      <div class="grp"><button id="tS" hidden>감속</button><button id="tD" hidden>대시</button><button id="tJ" class="jump">점프</button></div>
    </div>
    <div id="ov"></div>
  </div>
</div>

<script>
(()=>{
const $=s=>document.querySelector(s);
const cv=$('#cv'), cx=cv.getContext('2d');
const COL={void:'#0a0c11',slab:'#171c27',edge:'#ece6d6',line:'#262d3c',red:'#ff2d3d',redDim:'rgba(255,45,61,.25)',gold:'#ffc94a',run:'#5cf2d6',mute:'#8a90a0'};
const GRAV=2200, JUMP=760, SPEED=330, DASH_V=1100, DASH_T=0.18, GAUGE=2.5;
const ABIL=[
  {name:'더블 점프',short:'더블점프',desc:'공중에서 한 번 더 점프할 수 있어요. 넓은 낭떠러지와 높은 단차를 넘을 때 써요.',key:'공중에서 점프 키를 한 번 더'},
  {name:'대시',short:'대시',desc:'바라보는 방향으로 순간 돌진해요. 공중에서는 한 번, 착지하면 다시 충전돼요.',key:'Shift 또는 X'},
  {name:'벽 점프',short:'벽점프',desc:'벽에 붙으면 천천히 미끄러지고, 점프하면 벽을 차고 올라가요. 벽 쪽 방향키를 누른 채 점프를 반복하면 높은 탑도 올라가요.',key:'벽에 붙은 채 점프'},
  {name:'시간 감속',short:'감속',desc:'누르고 있는 동안 세상이 느려져요. 게이지를 쓰고, 기록 타이머는 그대로 흘러가요.',key:'C 길게 누르기'}
];
const CH_NAME=['붉은 가시밭','낙하 구간','끊어진 다리','수직 탑','감염된 화면'];

/* ---------- RNG & level generation ---------- */
function mulberry(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const rf=(R,a,b)=>a+(b-a)*R(), ri=(R,a,b)=>Math.floor(rf(R,a,b+1)), clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

function genChapter(ch,seed){
  const R=mulberry(seed*7919+ch*104729+13);
  const S={solids:[],spikes:[],crushers:[],lasers:[],saws:[],checks:[],goal:null,maxY:0,len:0,bullets:[],waves:[],beams:[],fx:[],boss:null,barrier:null};
  const floor=(x,w,y)=>{S.solids.push({x,y,w,h:900});S.maxY=Math.max(S.maxY,y)};
  const per=b=>b-ch*0.18;
  const SEG={
    spikes(x,fy){const L=rf(R,300,420);floor(x,L,fy);const n=ri(R,[1,2,3,3,3][ch],[3,4,5,6,6][ch]);S.spikes.push({x:x+(L-n*24)/2,y:fy,w:n*24});return[x+L,fy]},
    gap(x,fy){const g=ch?rf(R,140,210):rf(R,90,150);const dy=ri(R,-30,ch?50:40);const ny=fy+dy;floor(x+g,260,ny);return[x+g+260,ny]},
    bigGap(x,fy){const g=rf(R,240,300);const ny=fy+ri(R,-20,40);floor(x+g,300,ny);return[x+g+300,ny]},
    dashGap(x,fy){const g=rf(R,350,400);const ny=fy+ri(R,0,40);floor(x+g,320,ny);return[x+g+320,ny]},
    step(x,fy){floor(x,140,fy);let d=ch?rf(R,110,160):rf(R,50,95);if(fy<-150)d=-rf(R,80,140);const ny=fy-d;floor(x+140,300,ny);return[x+440,ny]},
    crusher(x,fy){floor(x,380,fy);S.crushers.push({x:x+155,w:70,h:60,top:fy-310,bot:fy-60,per:per(2.3),ph:R()});return[x+380,fy]},
    laser(x,fy){floor(x,320,fy);S.lasers.push({x:x+160,y1:fy-520,y2:fy,per:per(2.2),on:.45,ph:R()});return[x+320,fy]},
    saw(x,fy){floor(x,420,fy);S.saws.push({x1:x+70,x2:x+350,y:fy-22,r:20,per:per(2.8),ph:R()});return[x+420,fy]},
    plats(x,fy){let px=x,py=fy;for(let j=0;j<3;j++){const g=rf(R,120,170);const ny=clamp(py+rf(R,-50,40),fy-120,fy+80);S.solids.push({x:px+g,y:ny,w:100,h:24});px+=g+100;py=ny}
      const g=rf(R,120,160);const ly=clamp(py+rf(R,0,40),fy-120,fy+100);floor(px+g,260,ly);return[px+g+260,ly]},
    field(x,fy){floor(x,700,fy);const w=rf(R,250,300);S.spikes.push({x:x+150,y:fy,w:Math.round(w/24)*24});return[x+700,fy]},
    tower(x,fy){floor(x,220,fy);const H=rf(R,320,380);S.solids.push({x:x+220,y:fy-H,w:150,h:H+900});floor(x+370,260,fy);return[x+630,fy]},
    combo(x,fy){floor(x,640,fy);S.lasers.push({x:x+170,y1:fy-520,y2:fy,per:per(2.2),on:.45,ph:R()});S.crushers.push({x:x+420,w:70,h:60,top:fy-310,bot:fy-60,per:per(2.3),ph:R()});return[x+640,fy]}
  };
  const pools=[
    ['spikes','gap','step','crusher','laser','saw'],
    ['spikes','gap','step','crusher','laser','saw','plats','bigGap'],
    ['spikes','gap','crusher','laser','saw','plats','bigGap','dashGap','field'],
    ['spikes','gap','crusher','laser','saw','plats','dashGap','field','tower'],
    ['spikes','crusher','laser','saw','plats','bigGap','dashGap','field','tower','combo','combo']
  ][ch];
  const sig=[null,'bigGap','dashGap','tower',null][ch];
  floor(-400,800,0);let x=400,fy=0,last='';
  const N=12+ch;
  for(let i=0;i<N;i++){
    if(i>0&&i%4===0){floor(x,160,fy);S.checks.push({x:x+80,y:fy,on:false});x+=160}
    let t;
    if(sig&&(i===1||i===5||i===9))t=sig;
    else{do{t=pools[Math.floor(R()*pools.length)]}while(t===last)}
    last=t;[x,fy]=SEG[t](x,fy);
  }
  // 보스 경기장: 가짜 출구에 다가가면 보스가 부수고 경기장을 잠금
  floor(x,160,fy);S.checks.push({x:x+80,y:fy,on:false});x+=160;
  const AW=1100;S.arena={x0:x,x1:x+AW,fy,walls:[]};floor(x,AW,fy);
  S.solids.push({x:x+250,y:fy-140,w:130,h:24},{x:x+AW-380,y:fy-140,w:130,h:24});
  S.fake={x:x+AW*.62,y:fy,broken:false};S.revealX=x+AW+30;S.boss=makeBoss(ch,fy);x+=AW;
  floor(x,900,fy);S.goal={x:x+300,y:fy};S.len=x+900;
  S.respawn={x:0,y:0};
  S.theme=buildTheme(ch,seed,S);
  return S;
}

/* ---------- state ---------- */
const game={state:'menu',seed:1,ch:0,time:0,chStart:0,splits:[],deaths:0,hits:0,wt:0,lvl:null,gauge:GAUGE,slowing:false,banner:0,bossBanner:0,caughtT:0,deadT:0};
const P={x:0,y:0,w:26,h:34,vx:0,vy:0,onGround:false,face:1,coyote:0,buffer:0,air:0,canDash:true,dashT:0,dashDir:1,dashCd:0,lock:0,wall:0,cut:false,stun:0,inv:0,squash:0,trail:[]};
const keys={l:0,r:0,slow:0,jumpHeld:0};let dashPress=false;
const parts=[];let shake=0;const cam={x:0,y:-300};
const abil=()=>game.ch;
const store={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const bestKey=()=>'redline_best_'+game.seed+(DIFF===1?'':'_'+DIFFS[DIFF].id);

function fmt(t){const m=Math.floor(t/60),s=t-m*60;return m+':'+(s<10?'0':'')+s.toFixed(3)}
function fmtD(d){return(d>0?'+':'−')+Math.abs(d).toFixed(2)}

function loadChapter(ch){
  setBPM(CH_BPM[ch]||128);game.ch=ch;game.lvl=genChapter(ch,game.seed);game.lvl.respawn={x:0,y:0};
  game.chStart=game.time;game.banner=1.8;game.gauge=GAUGE;placePlayer(true);
}
function placePlayer(snap){
  const r=game.lvl.respawn;Object.assign(P,{x:r.x-13,y:r.y-P.h,vx:0,vy:0,onGround:true,face:1,dashT:0,lock:0,buffer:0,air:0,canDash:true,trail:[],stun:0,inv:0,lastHaz:null});A.scarf=null;
  if(snap){const v=view();cam.x=P.x-v.w*.33;cam.y=P.y-v.h*.58}
  const B=game.lvl.boss;if(B&&['enter','fight'].includes(B.state)&&!B.dead)resetBoss(B);
}

/* ---------- physics ---------- */
const ov=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
function crusherY(c,t){const p=((t/c.per)+c.ph)%1;let f;if(p<.45)f=0;else if(p<.55){const u=(p-.45)/.1;f=u*u}else if(p<.7)f=1;else f=1-(p-.7)/.3;return c.top+(c.bot-c.top)*f}
function laserState(l,t){const p=((t/l.per)+l.ph)%1;return p<l.on?2:(p>1-.16?1:0)}
function sawX(s,t){const p=((t/s.per)+s.ph)%1;return s.x1+(s.x2-s.x1)*(.5-.5*Math.cos(p*Math.PI*2))}

function step(dt){
  P.stun-=dt;P.inv-=dt;
  const L=game.lvl,ab=abil(),dirIn=P.stun>0?0:(keys.r?1:0)-(keys.l?1:0);
  if(dirIn&&P.dashT<=0&&P.lock<=0)P.face=dirIn;
  P.buffer-=dt;P.coyote-=dt;P.dashCd-=dt;
  if(P.onGround){P.coyote=.09;P.air=ab>=1?1:0;if(P.dashT<=0)P.canDash=true}
  if(dashPress&&P.stun<=0&&ab>=2&&P.canDash&&P.dashT<=0&&P.dashCd<=0){P.dashT=DASH_T;P.dashDir=P.face;P.canDash=false;P.dashCd=.3;P.lock=0;burst(P.x+13,P.y+17,COL.run,10,220)}
  dashPress=false;
  if(P.dashT>0){P.dashT-=dt;P.vx=P.dashDir*DASH_V;P.vy=0;if(P.dashT<=0)P.vx=P.dashDir*SPEED;const lt=P.trail[P.trail.length-1];if(!lt||Math.abs(lt.x-P.x)>16)P.trail.push({x:P.x,y:P.y,a:1})}
  else{
    if(P.lock>0)P.lock-=dt;else P.vx+=(dirIn*SPEED-P.vx)*Math.min(1,dt*(P.onGround?24:15));
    P.vy+=GRAV*dt;
    if(ab>=3&&P.wall&&!P.onGround&&P.vy>0)P.vy=Math.min(P.vy,dirIn===P.wall?110:260);
    P.vy=Math.min(P.vy,1300);
  }
  if(P.buffer>0&&P.stun<=0){
    if(P.coyote>0){P.vy=-JUMP;P.coyote=0;P.buffer=0;P.onGround=false;P.cut=false;P.dashT=0;P.squash=-.25}
    else if(ab>=3&&P.wall){P.vy=-JUMP*.95;P.vx=-P.wall*SPEED*1.05;P.lock=.13;P.face=-P.wall;P.buffer=0;P.air=1;P.canDash=true;P.dashT=0;P.cut=false;burst(P.x+(P.wall>0?P.w:0),P.y+20,COL.edge,6,140)}
    else if(P.air>0&&P.dashT<=0){P.air--;P.vy=-JUMP;P.buffer=0;P.cut=false;burst(P.x+13,P.y+P.h,COL.run,8,160)}
  }
  if(!keys.jumpHeld&&P.vy<-260&&!P.cut&&P.dashT<=0&&P.lock<=0){P.vy*=.6;P.cut=true}

  P.x+=P.vx*dt;
  for(const s of L.solids)if(ov(P,s)){if(P.vx>0)P.x=s.x-P.w;else if(P.vx<0)P.x=s.x+s.w;else P.x=(P.x+P.w/2<s.x+s.w/2)?s.x-P.w:s.x+s.w;P.vx=0;P.dashT=0}
  const prevVy=P.vy;P.y+=P.vy*dt;P.onGround=false;
  for(const s of L.solids)if(ov(P,s)){if(P.vy>0){P.y=s.y-P.h;P.onGround=true;if(prevVy>600)P.squash=.25}else if(P.vy<0)P.y=s.y+s.h;P.vy=0}
  P.wall=0;
  if(!P.onGround){const pl={x:P.x-1.5,y:P.y+6,w:1.5,h:P.h-12},pr={x:P.x+P.w,y:P.y+6,w:1.5,h:P.h-12};
    for(const s of L.solids){if(ov(pl,s))P.wall=-1;else if(ov(pr,s))P.wall=1}}

  const hb={x:P.x+3,y:P.y+3,w:P.w-6,h:P.h-6},t=game.wt;
  // 한 번 닿으면 한 번만 넉백: 같은 장애물에서 떨어졌다가 다시 닿으면 또 맞음 (무적 시간 없음)
  if(L.boss)updateBoss(L.boss,dt);
  let hz=null,hx=0,hv=0;

    game.slowing=sc<1;const wdt=dt*sc;game.wt+=wdt;

    let zt=1;if(arena){const base=Math.min(H/620,W/760);zt=Math.min(1,(W/base)/(L.arena.x1-L.arena.x0+90),(H/base)/700)}

function targetPose(){
  const sp=Math.min(1,Math.abs(P.vx)/SPEED),p=A.ph;
  if(P.stun>0)return{lean:-.35,bob:0,ta:.9,ka:.4,tb:.4,kb:.8,ac:-2.7,ec:.4,ad:2.6,ed:.5};
  if(P.dashT>0)return{lean:.6,bob:1,ta:-.8,ka:.9,tb:1,kb:.4,ac:-1.4,ec:.2,ad:-1.1,ed:.3};
  if(!P.onGround&&P.wall&&abil()>=3)return{lean:.05,bob:0,ta:.5,ka:1,tb:.95,kb:1.3,ac:2,ec:.5,ad:2.7,ed:.15};
  if(!P.onGround){
    if(P.vy<0)return{lean:.12,bob:0,ta:-.45,ka:.8,tb:1.15,kb:1.5,ac:-.9,ec:.7,ad:2.3,ed:.3};
    return{lean:0,bob:0,ta:.15,ka:.9,tb:.55,kb:.5,ac:-1.9,ec:.5,ad:1.7,ed:.5};
  }
  if(sp>.08){
    // 한쪽 다리 한 주기: 착지 → 지지 → 차고 나감 → 뒤꿈치 올림 → 무릎 끌어올림 → 뻗기
    const u=A.u%1,la=legAt(u),lb=legAt((u+.5)%1),w=Math.min(1,sp*1.15);
    const sw=Math.cos(2*Math.PI*(u-.22));            // 팔은 반대쪽 다리와 엇갈려 흔듦
    const ar=x=>x>0?x*1.05:x*.65;                      // 앞으로는 크게, 뒤로는 작게
    const idl={ta:.06,ka:.08,tb:-.06,kb:.08,ac:.12,ec:.3,ad:-.08,ed:.3};
    const run={ta:la[0],ka:la[1],tb:lb[0],kb:lb[1],ac:.15+ar(sw),ec:1.25+.35*sw,ad:.15+ar(-sw),ed:1.25-.35*sw};
    const o={lean:(.26+.04*Math.cos(4*Math.PI*u))*w,bob:(1.5*Math.cos(4*Math.PI*(u-.15))+.4)*w};
    for(const k in run)o[k]=idl[k]+(run[k]-idl[k])*w;
    return o}
  return{lean:0,bob:Math.sin(A.t*2.6)*.7,ta:.06,ka:.08,tb:-.06,kb:.08,ac:.12+Math.sin(A.t*2.6)*.04,ec:.3,ad:-.08,ed:.3};
}
function animate(dt){
  A.t+=dt;if(P.dashT<=0&&P.stun<=0)A.face=P.face;else if(P.dashT>0)A.face=P.dashDir;
  if(game.state!=='play'&&game.state!=='outro')return;
  if(P.onGround){const sp=Math.abs(P.vx);A.u+=sp*dt/(70+sp*.12);const st=Math.floor(A.u*2);if(st!==A.step){A.step=st;if(sp>200)for(let i=0;i<3;i++)parts.push({x:P.x+P.w/2-A.face*2,y:P.y+P.h-1,vx:-A.face*(40+Math.random()*60),vy:-40-Math.random()*60,life:.25+Math.random()*.15,c:'rgba(236,230,214,.55)'})}}
  else if(P.vy>0)A.u=.6;
  const tp=targetPose(),k=1-Math.exp(-dt*(P.onGround&&Math.abs(P.vx)>40?30:16));
  for(const key of POSE_KEYS)A.pose[key]+=(tp[key]-A.pose[key])*k;
  // 머플러: 목에서 늘어지는 줄, 달리는 반대 방향으로 휘날림
  const Q=A.pose,f=A.face,nx=P.x+P.w/2+Math.sin(Q.lean)*12*f,ny=P.y+P.h-16+Q.bob-Math.cos(Q.lean)*12;
  if(!A.scarf)A.scarf=Array.from({length:7},(_,i)=>({x:nx-f*i*4,y:ny+i}));
  const sc=A.scarf;sc[0].x=nx;sc[0].y=ny;
  for(let i=1;i<sc.length;i++){const a=sc[i],b=sc[i-1],w=Math.sin(A.t*14-i*.9)*(1+Math.abs(P.vx)/250);
    const tx=b.x-f*3-P.vx*.012,ty=b.y+2.2-P.vy*.004+w*.9;a.x+=(tx-a.x)*Math.min(1,dt*22);a.y+=(ty-a.y)*Math.min(1,dt*22);
    const dx=a.x-b.x,dy=a.y-b.y,d=Math.hypot(dx,dy)||1;a.x=b.x+dx/d*4.5;a.y=b.y+dy/d*4.5}
}
function drawChar(fx,fy,alpha,ghost){
  const Q=A.pose,f=A.face,sq=ghost?0:P.squash;
  cx.save();cx.globalAlpha=alpha;cx.translate(fx,fy);cx.scale(1+sq,1-sq);cx.lineCap='round';cx.lineJoin='round';
  const pt=(o,a,l)=>({x:o.x+Math.sin(a)*l*f,y:o.y+Math.cos(a)*l});
  const hip={x:0,y:-16+Q.bob};
  { // 발이 바닥을 뚫지 않게: 가장 낮은 발이 땅에 닿도록 몸 전체를 올림
    const fy2=(t,k)=>hip.y+Math.cos(t)*8+Math.cos(t-k)*8.5+1.8,lo=Math.max(fy2(Q.ta,Q.ka),fy2(Q.tb,Q.kb));if(lo>0)hip.y-=lo}
  const sh=pt(hip,Math.PI-Q.lean,12),neck=pt(sh,Math.PI-Q.lean,2.5),head=pt(neck,Math.PI-Q.lean,5.5);
  const seg=(a,b,c,w)=>{cx.strokeStyle=c;cx.lineWidth=w;cx.beginPath();cx.moveTo(a.x,a.y);cx.lineTo(b.x,b.y);cx.stroke()};
  const leg=(t,k,dark)=>{const kn=pt(hip,t,8),ft=pt(kn,t-k,8.5);seg(hip,kn,dark?OUT.pantsB:OUT.pants,5.5);seg(kn,ft,dark?OUT.pantsB:OUT.pants,5);
    const toe={x:ft.x+f*4,y:ft.y};seg({x:ft.x-f*1.5,y:ft.y},toe,OUT.shoe,4.5);seg({x:ft.x-f*1.5,y:ft.y+1.8},{x:toe.x+f*.5,y:toe.y+1.8},OUT.sole,1.5)};
  const arm=(a,e,dark)=>{const el=pt(sh,a+Q.lean,6.5),hd=pt(el,a+Q.lean+e,6);seg(sh,el,dark?OUT.jacketB:OUT.jacket,4.5);seg(el,hd,dark?OUT.jacketB:OUT.jacket,4);
    cx.fillStyle=OUT.skin;cx.beginPath();cx.arc(hd.x,hd.y,2.1,0,7);cx.fill()};
  // 머플러 (뒤)
  if(!ghost&&A.scarf){cx.save();cx.translate(-fx,-fy);cx.strokeStyle=OUT.scarf;cx.lineWidth=3.2;cx.beginPath();A.scarf.forEach((p,i)=>i?cx.lineTo(p.x,p.y):cx.moveTo(p.x,p.y));cx.stroke();cx.restore()}
  arm(Q.ac,Q.ec,true);leg(Q.ta,Q.ka,true);
  // 몸통: 자켓 + 지퍼 + 허리 밴드
  seg({x:hip.x,y:hip.y-1},sh,OUT.jacket,10);
  const mid=pt(hip,Math.PI-Q.lean,1.5);seg(mid,pt(hip,Math.PI-Q.lean,11),OUT.zip,1);
  seg(pt(hip,Math.PI-Q.lean,.5),pt(pt(hip,Math.PI-Q.lean,.5),Math.PI/2,.01),OUT.jacketB,10.5);
  leg(Q.tb,Q.kb,false);
  // 머리
  cx.fillStyle=OUT.skin;cx.beginPath();cx.arc(head.x,head.y,5.6,0,7);cx.fill();
  cx.fillStyle=OUT.hair;cx.beginPath();cx.arc(head.x,head.y,5.9,Math.PI*.95,Math.PI*2.05);cx.fill();
  cx.beginPath();cx.moveTo(head.x-f*4,head.y-4.5);cx.lineTo(head.x-f*9,head.y-3+Math.sin(A.t*12)*.8);cx.lineTo(head.x-f*4.5,head.y-.5);cx.fill();
  seg({x:head.x-f*5.6,y:head.y-1.6},{x:head.x+f*5.6,y:head.y-2.6},OUT.scarf,1.6);
  cx.fillStyle=OUT.hair;cx.beginPath();cx.arc(head.x+f*3,head.y+.6,P.stun>0?.6:1.1,0,7);cx.fill();
  arm(Q.ad,Q.ed,false);
  cx.restore();
}

/* ---------- HUD & overlays ---------- */
function renderHud(){
  $('#chLabel').textContent=(game.state==='menu'?'':'CH '+(game.ch+1)+' · ')+'코스 #'+String(game.seed).padStart(4,'0');
  const have=game.state==='menu'?0:(game.state==='card'||game.state==='done'?game.ch+1:game.ch);
  $('#chips').innerHTML=ABIL.map((a,i)=>`<span class="chip${i<have?' on':''}">${i<have?'':'🔒 '}${a.short}</span>`).join('')+`<span class="chip${DIFF===4?' hellc':''}">${DF().name}</span><span class="chip">${muted?'소리 끔':'소리 켬'} (M)</span><span class="chip deaths">피격 ${game.hits} · 리스폰 ${game.deaths}</span>`;
  $('#tD').hidden=game.ch<2;$('#tS').hidden=game.ch<4;
}
const ovEl=$('#ov');
function overlay(html){ovEl.innerHTML=html;ovEl.hidden=!html;const b=ovEl.querySelector('button.go');if(b)b.focus({preventScroll:true})}
function bestData(){return store.get(bestKey())}
function showMenu(){
  game.state='menu';renderHud();const b=bestData();
  overlay(`<div class="card"><div class="eyebrow">스피드런 · 5 챕터</div><h1>레드 라인</h1>
  <p>가시, 분쇄기, 레이저, 톱날 같은 빨간 장애물에 닿으면 튕겨 나가요. 낭떠러지로 밀려 떨어지면 체크포인트로 돌아가요. 그런데 출구에 다가가면 보스가 나타나 경기장을 잠가요. 박자에 맞춰 쏟아지는 공격을 끝까지 버티면 진짜 출구가 열려요.</p>
  <div class="keys"><kbd>← → / A D</kbd><span>이동</span><kbd>Space / ↑ / W</kbd><span>점프 (길게 누르면 높이)</span><kbd>Shift / X</kbd><span>대시 · 2챕터부터</span><kbd>C</kbd><span>시간 감속 · 5챕터</span><kbd>Esc · R</kbd><span>일시정지 · 처음부터</span><kbd>M</kbd><span>소리 켜기 · 끄기</span></div>
  <div class="row" style="justify-content:space-between;align-items:center"><span class="eyebrow">코스 #${String(game.seed).padStart(4,'0')} · ${DF().name} 최고 기록</span><span class="big" style="font-size:20px">${b?fmt(b.total):'—'}</span></div>
  <div class="row"><button class="go" id="bStart">달리기 시작 (Enter)</button><button id="bSeed">새 코스 생성</button><button id="bCh5">Chapter 5 바로가기 (연습)</button></div></div>`);
  $('#bStart').onclick=()=>{game.startCh=0;showDiff()};$('#bSeed').onclick=newSeed;$('#bCh5').onclick=()=>{game.startCh=4;showDiff()};
}
function showDiff(){
  game.state='menu';
  overlay(`<div class="card"><div class="eyebrow">시작하기 전에</div><h2>난이도 선택</h2>
  <p style="color:var(--mute);font-size:13px">보스전에서 버텨야 하는 시간과 공격의 양, 속도가 달라져요. 최고 기록은 난이도마다 따로 저장돼요.</p>
  <div class="diffs" role="radiogroup" aria-label="난이도">${DIFFS.map((d,i)=>`<button class="diff${i===DIFF?' sel':''}${i===4?' hell':''}" role="radio" aria-checked="${i===DIFF}" data-i="${i}"><span class="dn"><kbd>${i+1}</kbd>${d.name}</span><span class="dd">${d.desc}</span><span class="dt">버팀 ${Math.round(BASE_SEC[0]*d.len)}~${Math.round(BASE_SEC[4]*d.len)}초</span></button>`).join('')}</div>
  <div class="row"><button class="go" id="bGo">${DF().name}로 시작 (Enter)</button><button id="bBack">뒤로</button></div></div>`);
  ovEl.querySelectorAll('.diff').forEach(b=>b.onclick=()=>pickDiff(+b.dataset.i));
  $('#bGo').onclick=startRun;$('#bBack').onclick=showMenu;
}
function pickDiff(i){DIFF=clamp(i,0,4);try{localStorage.setItem('redline_diff',JSON.stringify(DIFF))}catch(e){}
  ovEl.querySelectorAll('.diff').forEach(b=>{const on=+b.dataset.i===DIFF;b.classList.toggle('sel',on);b.setAttribute('aria-checked',on)});const g=$('#bGo');if(g)g.textContent=DF().name+'로 시작 (Enter)';renderHud()}
function newSeed(){game.seed=1+Math.floor(Math.random()*9999);game.lvl=genChapter(0,game.seed);showMenu()}
function startRun(){const sc=game.startCh||0;Object.assign(game,{time:0,splits:[],deaths:0,hits:0,wt:0,practice:sc>0});parts.length=0;loadChapter(sc);game.state='play';overlay('');renderHud()}
function showCard(split){
  const b=bestData(),bs=b&&b.splits[game.ch];const a=ABIL[game.ch];
  overlay(`<div class="card"><div class="eyebrow">Chapter ${game.ch+1} 클리어 · ${CH_NAME[game.ch]}</div>
  <div class="row" style="align-items:baseline;gap:12px"><span class="big">${fmt(split)}</span>${bs?`<span class="${split>bs?'up':'down'}" style="font-family:var(--f-mono)">${fmtD(split-bs)}</span>`:''}</div>
  <div class="ability"><span class="eyebrow gold">새 능력 획득</span><b>${a.name}</b><p>${a.desc}</p><div class="keys"><kbd>${a.key}</kbd><span></span></div></div>
  <p style="color:var(--mute);font-size:13px">다음: Chapter ${game.ch+2} · ${CH_NAME[game.ch+1]}. 이 화면에서는 타이머가 멈춰 있어요.</p>
  <div class="row"><button class="go" id="bNext">Chapter ${game.ch+2} 시작 (Enter)</button></div></div>`);
  $('#bNext').onclick=nextChapter;
}
function nextChapter(){loadChapter(game.ch+1);game.state='play';overlay('');renderHud()}
const GRADES=['S','A','B','C','D','F'],GCOL={S:'var(--gold)',A:'var(--good)',B:'#8fb4ff',C:'var(--chalk)',D:'var(--mute)',F:'var(--red)'};
function gradeOf(hits,deaths){const f=[.7,1,1.4,1.9,2.6][DIFF],p=hits+deaths*3,T=[3,8,15,25,40].map(x=>Math.round(x*f));for(let i=0;i<5;i++)if(p<=T[i])return{g:GRADES[i],i,p,T};return{g:'F',i:5,p,T}}
function showDone(){
  const b=bestData(),total=game.time,isPB=!b||total<b.total,G=gradeOf(game.hits,game.deaths),gk=bestKey()+'_grade',bg=store.get(gk),newG=bg==null||G.i<bg;
  if(game.practice){overlay(`<div class="card"><div class="eyebrow">연습 완료 · Chapter 5 바로가기</div><div class="big">${fmt(total)}</div><p class="mute">연습 모드라 기록과 등급은 저장되지 않아요.</p><div class="row"><button class="go" id="bAgain">다시 연습 (Enter)</button><button id="bMenu">메뉴</button></div></div>`);$('#bAgain').onclick=startRun;$('#bMenu').onclick=()=>{game.startCh=0;game.ch=0;game.lvl=genChapter(0,game.seed);showMenu()};return}
  if(isPB)store.set(bestKey(),{total,splits:game.splits.slice()});if(newG)store.set(gk,G.i);
  const nextG=G.i>0?`${GRADES[G.i-1]} 등급까지 벌점 ${G.T[G.i-1]} 이하`:'최고 등급이에요';
  overlay(`<div class="card"><div class="eyebrow">완주 · 코스 #${String(game.seed).padStart(4,'0')} · ${DF().name}</div>
  <div class="gradeRow"><div class="grade" style="color:${GCOL[G.g]}" aria-label="등급 ${G.g}">${G.g}</div><div class="gradeInfo"><h2>${isPB?'<span class="gold">개인 최고 기록!</span>':'완주했어요'}</h2>
  <p>피격 ${game.hits} + 리스폰 ${game.deaths}×3 = 벌점 <b>${G.p}</b></p><p class="mute">${nextG}${bg!=null&&!newG?` · 최고 등급 ${GRADES[bg]}`:newG&&bg!=null?' · 최고 등급 갱신!':''}</p></div></div>
  <div class="row" style="align-items:baseline;gap:12px"><span class="big">${fmt(total)}</span>${b?`<span class="${total>b.total?'up':'down'}" style="font-family:var(--f-mono)">${fmtD(total-b.total)}</span>`:''}</div>
  <table>${game.splits.map((s,i)=>`<tr><td>CH${i+1} ${CH_NAME[i]}</td><td>${fmt(s)}</td><td class="${b?(s>b.splits[i]?'up':'down'):''}">${b?fmtD(s-b.splits[i]):''}</td></tr>`).join('')}
  <tr><td>피격</td><td>${game.hits}회</td><td></td></tr><tr><td>리스폰</td><td>${game.deaths}회</td><td></td></tr></table>
  <div class="row"><button class="go" id="bAgain">다시 달리기 (Enter)</button><button id="bDiff">난이도 바꾸기</button><button id="bMenu">메뉴</button></div></div>`);
  $('#bAgain').onclick=startRun;$('#bDiff').onclick=showDiff;$('#bMenu').onclick=()=>{game.ch=0;game.lvl=genChapter(0,game.seed);showMenu()};
}
function pause(){if(game.state!=='play'&&game.state!=='dead')return;game.prev=game.state;game.state='pause';
  overlay(`<div class="card"><div class="eyebrow">일시정지</div><h2>${fmt(game.time)}</h2><div class="row"><button class="go" id="bRes">계속 (Esc)</button><button id="bRst">처음부터 (R)</button></div></div>`);
  $('#bRes').onclick=resume;$('#bRst').onclick=startRun}
function resume(){if(game.state!=='pause')return;game.state=game.prev||'play';overlay('');last=performance.now()}

/* ---------- input ---------- */
const JUMPK=['Space','ArrowUp','KeyW','KeyZ'],LK=['ArrowLeft','KeyA'],RK=['ArrowRight','KeyD'],DK=['ShiftLeft','ShiftRight','KeyX'];
addEventListener('keydown',e=>{
  const c=e.code;audioInit();if(c==='KeyM'){muted=!muted;renderHud();return}
  if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(c))e.preventDefault();
  if(!ovEl.hidden&&ovEl.querySelector('.diffs')){const m=c.match(/^Digit([1-5])$/);if(m){pickDiff(+m[1]-1);return}if(c==='ArrowLeft'||c==='ArrowUp'){pickDiff(DIFF-1);return}if(c==='ArrowRight'||c==='ArrowDown'){pickDiff(DIFF+1);return}}
  if(c==='Enter'){const b=ovEl.querySelector('button.go');if(b&&!ovEl.hidden){e.preventDefault();b.click()}return}
  if(c==='Escape'){game.state==='pause'?resume():pause();return}
  if(c==='KeyR'&&['play','dead','pause','done'].includes(game.state)){startRun();return}
  if(LK.includes(c))keys.l=1;if(RK.includes(c))keys.r=1;if(c==='KeyC')keys.slow=1;
  if(JUMPK.includes(c)&&!e.repeat){P.buffer=.11;keys.jumpHeld=1}
  if(DK.includes(c)&&!e.repeat)dashPress=true;
});
addEventListener('pointerdown',audioInit);
addEventListener('keyup',e=>{const c=e.code;if(LK.includes(c))keys.l=0;if(RK.includes(c))keys.r=0;if(c==='KeyC')keys.slow=0;if(JUMPK.includes(c))keys.jumpHeld=0});
addEventListener('blur',()=>{keys.l=keys.r=keys.slow=keys.jumpHeld=0});
document.addEventListener('visibilitychange',()=>{if(document.hidden)pause()});
function hold(id,down,up){const b=$(id);b.addEventListener('pointerdown',e=>{e.preventDefault();try{b.setPointerCapture(e.pointerId)}catch(_){ }down()});['pointerup','pointercancel','lostpointercapture'].forEach(ev=>b.addEventListener(ev,up))}
hold('#tL',()=>keys.l=1,()=>keys.l=0);hold('#tR',()=>keys.r=1,()=>keys.r=0);
hold('#tJ',()=>{P.buffer=.11;keys.jumpHeld=1},()=>keys.jumpHeld=0);hold('#tD',()=>dashPress=true,()=>{});hold('#tS',()=>keys.slow=1,()=>keys.slow=0);
try{if(matchMedia('(pointer:coarse)').matches)$('#touch').hidden=false}catch(e){}

/* ---------- boot ---------- */
resize();game.lvl=genChapter(0,game.seed);showMenu();requestAnimationFrame(frame);
})();
</script>
